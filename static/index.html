<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      display: flex;
      justify-content: center;
    }
    .chat {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-left: 1px solid #e3e5e8;
      border-right: 1px solid #e3e5e8;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #e3e5e8;
    }
    header h1 { margin: 0; font-size: 18px; }
    header p  { margin: 4px 0 0; font-size: 13px; color: #6b7280; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 80%; display: flex; flex-direction: column; gap: 4px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot  { align-self: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user .bubble { background: #1f6feb; color: #ffffff; }
    .bot .bubble  { background: #f0f1f3; }
    .tag { font-size: 12px; color: #6b7280; }

    .approval {
      align-self: stretch;
      border: 1px solid #d4a72c;
      background: #fff8e1;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .approval strong { display: block; margin-bottom: 6px; }
    .approval code { display: block; margin-bottom: 10px; color: #57606a; word-break: break-word; }
    .approval button { margin-right: 8px; }

    form {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid #e3e5e8;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
    }
    input:focus { outline: 2px solid #1f6feb; outline-offset: 1px; }
    button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid #d0d7de;
      background: #ffffff;
      cursor: pointer;
    }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #ffffff; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>Customer Support</h1>
      <p>Ask about orders, refunds, login problems or shop policies. Try order IDs ORD-1001 to ORD-1006.</p>
    </header>

    <section id="messages" aria-live="polite"></section>

    <form id="chat-form">
      <label for="message-input" class="visually-hidden" hidden>Message</label>
      <input id="message-input" type="text" placeholder="Type your message…" autocomplete="off" required>
      <button id="send-button" class="primary" type="submit">Send</button>
    </form>
  </main>

  <script>
    const messagesBox = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");

    // One memory per browser tab session
    const sessionId = "web_" + Math.random().toString(36).slice(2, 10);

    function addMessage(text, who, agentName) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + who;

      if (agentName) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = agentName;
        wrap.appendChild(tag);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;       // textContent = safe, no HTML injection
      wrap.appendChild(bubble);

      messagesBox.appendChild(wrap);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return wrap;
    }

    function showApproval(details) {
      const box = document.createElement("div");
      box.className = "approval";

      const title = document.createElement("strong");
      title.textContent = "Manager approval needed";
      const info = document.createElement("code");
      info.textContent = details;

      const approveBtn = document.createElement("button");
      approveBtn.className = "primary";
      approveBtn.textContent = "Approve refund";
      const rejectBtn = document.createElement("button");
      rejectBtn.textContent = "Reject refund";

      async function decide(approve) {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        await sendRequest("/approve", { session_id: sessionId, approve: approve });
        box.remove();
      }
      approveBtn.addEventListener("click", () => decide(true));
      rejectBtn.addEventListener("click", () => decide(false));

      box.append(title, info, approveBtn, rejectBtn);
      messagesBox.appendChild(box);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function sendRequest(url, body) {
      const typing = addMessage("Typing…", "bot");
      sendButton.disabled = true;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage(data.detail || "Something went wrong. Please try again.", "bot");
        } else if (data.needs_approval) {
          addMessage("This refund needs a manager's approval before it can be processed.", "bot", data.agent);
          showApproval(data.approval_details);
        } else {
          addMessage(data.reply, "bot", data.agent);
        }
      } catch (error) {
        typing.remove();
        addMessage("Can't reach the server. Is it running?", "bot");
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      await sendRequest("/chat", { session_id: sessionId, message: text });
    });

    addMessage("Hi! How can I help you today?", "bot", "Support");
  </script>
</body>
</html>
